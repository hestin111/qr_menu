<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu</title>
<style>
  :root {
    --paper: #f6f7f4;         /* page background */
    --card: #ffffff;          /* item cards */
    --ink: #1c2430;
    --muted: #5d6673;
    --line: #c9cdd2;
    --accent: #2f6f4e;        /* fills: header, bars, active button */
    --accent-ink: #ffffff;    /* text on top of an accent fill */
    --accent-text: #2f6f4e;   /* accent used AS text on the page: always readable */
    --tile: rgba(47, 111, 78, 0.15);  /* soft tint behind emoji */
    --sold: #6b727c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #151a20;
      --card: #1f262e;
      --ink: #eef0f2;
      --muted: #a3abb5;
      --line: #3a424c;
      --sold: #8d96a1;
      --accent-text: #6fcf9a;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 72px; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    /* System fonts only: fast on slow data, and phones render Amharic natively */
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Ethiopic", "Nyala", sans-serif;
    font-size: 17px;
    line-height: 1.5;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 18px 48px; }

  /* Colourful header block */
  header.top {
    margin: 0 -18px; padding: 26px 18px 22px;
    background: var(--accent); color: var(--accent-ink);
    border-radius: 0 0 24px 24px;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
  }
  header.top h1 { margin: 0; font-size: 2rem; line-height: 1.15; letter-spacing: -0.01em; }
  header.top p { margin: 4px 0 0; font-size: 0.97rem; }

  .lang {
    flex: none;
    border: 2px solid var(--accent-ink);
    background: transparent;
    color: var(--accent-ink);
    border-radius: 999px;
    padding: 6px 14px;
    font: inherit;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .lang:hover { background: var(--accent-ink); color: var(--accent); }

  nav.cats {
    position: sticky; top: 0; z-index: 5;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    margin: 0 -18px; padding: 10px 18px;
    display: flex; gap: 8px; overflow-x: auto; white-space: nowrap;
    -webkit-overflow-scrolling: touch;
  }
  nav.cats a {
    color: var(--ink); text-decoration: none;
    padding: 6px 14px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--card); font-size: 0.92rem;
  }
  nav.cats a:hover { border-color: var(--accent); }
  nav.cats a.active { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  section.cat { padding-top: 26px; }
  section.cat h2 {
    margin: 0 0 8px; font-size: 1.3rem;
    color: var(--accent-text);
    border-left: 6px solid var(--accent);
    padding-left: 10px;
  }

  /* Each menu item is a card, with an optional picture on the left */
  .item {
    display: flex; align-items: flex-start; gap: 12px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 10px;
    margin: 10px 0;
  }
  .thumb {
    flex: none; width: 72px; height: 72px;
    border-radius: 12px; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .thumb.tile { background: var(--tile); font-size: 2.2rem; line-height: 1; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .info { flex: 1; min-width: 0; align-self: center; }

  .row { display: flex; align-items: baseline; gap: 8px; }
  .row .name { font-weight: 600; }
  .row .dots { flex: 1; min-width: 12px; border-bottom: 2px dotted var(--line); transform: translateY(-4px); }
  .row .price { font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
  .info .desc { margin: 2px 0 0; color: var(--muted); font-size: 0.92rem; }

  .item.sold .name, .item.sold .price { color: var(--sold); text-decoration: line-through; font-weight: 400; }
  .item.sold .desc { color: var(--sold); }
  .item.sold .thumb { filter: grayscale(1); opacity: 0.55; }
  .badge {
    font-size: 0.75rem; font-weight: 600; color: var(--muted);
    border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; margin-left: 8px;
    text-decoration: none; display: inline-block;
  }

  .msg { padding: 56px 0; text-align: center; color: var(--muted); }
  .msg a { color: var(--accent-text); }
  .msg ul { list-style: none; padding: 0; margin: 16px 0 0; }
  .msg li { margin: 8px 0; }

  footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 0.8rem; color: var(--muted); text-align: center; }

  a:focus-visible, button:focus-visible { outline: 3px solid var(--accent-text); outline-offset: 2px; }
  header.top button:focus-visible { outline-color: var(--accent-ink); }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="msg" id="status">Loading menu…</div>
</div>

<script>
(function () {
  var app = document.getElementById('app');

  // ---- Which restaurant? ----
  // Production: the path, e.g. /abebe-cafe
  // Local testing (no redirect rules): /index.html?r=abebe-cafe
  var params = new URLSearchParams(location.search);
  var slug = (params.get('r') || location.pathname.replace(/^\/+|\/+$/g, '')).toLowerCase();
  if (slug === 'index.html') slug = '';

  // ---- Language (English / Amharic) ----
  var lang = 'en';
  try { lang = localStorage.getItem('menu-lang') || 'en'; } catch (e) {}
  if (lang !== 'en' && lang !== 'am') lang = 'en';

  var UI = {
    en: { sold: 'Sold out', currency: 'birr', toggle: 'አማርኛ', notFound: 'Menu not found', notFoundHelp: 'Check the link or ask the restaurant for a new QR code.', error: 'Could not load the menu. Check your connection and try again.', powered: 'Menu by YourBrand' },
    am: { sold: 'አልቋል', currency: 'ብር', toggle: 'English', notFound: 'ምናሌው አልተገኘም', notFoundHelp: 'ሊንኩን ያረጋግጡ ወይም ከሬስቶራንቱ አዲስ QR ኮድ ይጠይቁ።', error: 'ምናሌውን መጫን አልተቻለም። ግንኙነትዎን ያረጋግጡ እና እንደገና ይሞክሩ።', powered: 'ምናሌ በ YourBrand' }
  };

  // Pick text in the chosen language, fall back to the other if missing
  function t(obj) {
    if (obj == null) return '';
    if (typeof obj === 'string') return obj;
    return obj[lang] || obj.en || obj.am || '';
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;   // textContent only: owner-typed text can never inject code
    return n;
  }

  // ---- Colour helpers (keep text readable on any restaurant colours) ----
  var darkQuery = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  var currentColors = null;
  var HEX = /^#[0-9a-fA-F]{6}$/;

  function hexToRgb(hex) {
    return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
  }
  function lum(c) {
    var f = function (v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
    return 0.2126 * f(c[0]) + 0.7152 * f(c[1]) + 0.0722 * f(c[2]);
  }
  function contrast(a, b) {
    var l1 = lum(a), l2 = lum(b);
    return (Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05);
  }
  function toHex(c) {
    return '#' + c.map(function (v) {
      var h = Math.round(v).toString(16);
      return h.length < 2 ? '0' + h : h;
    }).join('');
  }

  // colors = { accent, bg, bgDark } straight from menus.json (all optional)
  function applyColors(colors) {
    var root = document.documentElement.style;
    currentColors = colors;
    var dark = !!(darkQuery && darkQuery.matches);

    // Page background: restaurant's own (if valid), otherwise the default from the CSS
    var custom = dark ? colors.bgDark : colors.bg;
    var paper = dark ? [21, 26, 32] : [246, 247, 244];
    if (HEX.test(custom || '')) {
      paper = hexToRgb(custom);
      root.setProperty('--paper', custom);
    } else {
      root.removeProperty('--paper');
    }
    var card = dark ? [31, 38, 46] : [255, 255, 255];

    if (!HEX.test(colors.accent || '')) return;
    var base = hexToRgb(colors.accent);

    // Accent as text: lighten (dark mode) or darken (light mode) until contrast >= 4.5
    // on BOTH the page background and the cards
    var target = dark ? [255, 255, 255] : [0, 0, 0];
    var txt = base.slice();
    for (var i = 0; i < 25 && (contrast(txt, paper) < 4.5 || contrast(txt, card) < 4.5); i++) {
      txt = txt.map(function (v, k) { return v + (target[k] - v) * 0.12; });
    }

    // Text on top of an accent fill: white or near-black, whichever reads better
    var white = [255, 255, 255], black = [17, 17, 17];
    var ink = contrast(base, white) >= contrast(base, black) ? white : black;

    root.setProperty('--accent', colors.accent);
    root.setProperty('--accent-text', toHex(txt));
    root.setProperty('--accent-ink', toHex(ink));
    root.setProperty('--tile', 'rgba(' + base.join(',') + ',' + (dark ? '0.28' : '0.16') + ')');
  }

  // If the phone switches between light and dark, recalculate
  if (darkQuery) {
    var onScheme = function () { if (currentColors) applyColors(currentColors); };
    if (darkQuery.addEventListener) darkQuery.addEventListener('change', onScheme);
    else if (darkQuery.addListener) darkQuery.addListener(onScheme);
  }

  var data = null;

  function showMessage(title, body, list) {
    app.textContent = '';
    var box = el('div', 'msg');
    box.appendChild(el('strong', null, title));
    if (body) box.appendChild(el('p', null, body));
    if (list) box.appendChild(list);
    app.appendChild(box);
  }

  // Picture for one item: a small photo (it.img) or an emoji tile (it.emoji). Both optional.
  function makeThumb(it) {
    var imgPath = typeof it.img === 'string' ? it.img : '';
    var emoji = typeof it.emoji === 'string' ? it.emoji : '';
    if (!imgPath && !emoji) return null;

    var box = el('div', 'thumb');
    box.setAttribute('aria-hidden', 'true');   // the item name is already next to it

    function showEmojiOrNothing() {
      if (emoji) { box.className = 'thumb tile'; box.textContent = emoji; }
      else if (box.parentNode) { box.parentNode.removeChild(box); }
    }

    if (imgPath) {
      var im = document.createElement('img');
      im.alt = '';
      im.width = 72; im.height = 72;
      im.loading = 'lazy';        // pictures load later, so the text shows first
      im.decoding = 'async';
      im.onerror = function () { box.textContent = ''; showEmojiOrNothing(); };
      im.src = imgPath;
      box.appendChild(im);
    } else {
      box.className = 'thumb tile';
      box.textContent = emoji;
    }
    return box;
  }

  function render() {
    var r = data[slug];
    document.documentElement.lang = lang === 'am' ? 'am' : 'en';

    if (!r) {
      var list = null;
      // Demo helper: lists the restaurants in menus.json. Delete this block in production.
      if (!slug) {
        list = el('ul');
        Object.keys(data).forEach(function (key) {
          var li = el('li');
          var a = el('a', null, t(data[key].name));
          a.href = '?r=' + encodeURIComponent(key);
          li.appendChild(a);
          list.appendChild(li);
        });
      }
      showMessage(UI[lang].notFound, UI[lang].notFoundHelp, list);
      document.title = UI[lang].notFound;
      return;
    }

    // Per-restaurant colours
    applyColors({ accent: r.accent, bg: r.bg, bgDark: r.bgDark });

    document.title = t(r.name);
    app.textContent = '';

    // Header + language toggle
    var header = el('header', 'top');
    var titleBox = el('div');
    titleBox.appendChild(el('h1', null, t(r.name)));
    if (r.tagline) titleBox.appendChild(el('p', null, t(r.tagline)));
    header.appendChild(titleBox);
    var btn = el('button', 'lang', UI[lang].toggle);
    btn.type = 'button';
    btn.addEventListener('click', function () {
      lang = lang === 'en' ? 'am' : 'en';
      try { localStorage.setItem('menu-lang', lang); } catch (e) {}
      render();
    });
    header.appendChild(btn);
    app.appendChild(header);

    // Category navigation
    var cats = r.categories || [];
    var nav = el('nav', 'cats');
    cats.forEach(function (c, i) {
      var a = el('a', null, t(c.name));
      a.href = '#cat-' + i;
      nav.appendChild(a);
    });
    if (cats.length > 1) app.appendChild(nav);

    // Categories and items
    cats.forEach(function (c, i) {
      var sec = el('section', 'cat');
      sec.id = 'cat-' + i;
      sec.appendChild(el('h2', null, t(c.name)));

      (c.items || []).forEach(function (it) {
        var available = it.available !== false;
        var item = el('div', 'item' + (available ? '' : ' sold'));

        var thumb = makeThumb(it);
        if (thumb) item.appendChild(thumb);

        var info = el('div', 'info');
        var row = el('div', 'row');
        var name = el('span', 'name', t(it.name));
        if (!available) name.appendChild(el('span', 'badge', UI[lang].sold));
        row.appendChild(name);
        row.appendChild(el('span', 'dots'));
        row.appendChild(el('span', 'price', it.price + ' ' + UI[lang].currency));
        info.appendChild(row);

        var d = t(it.desc);
        if (d) info.appendChild(el('p', 'desc', d));
        item.appendChild(info);
        sec.appendChild(item);
      });
      app.appendChild(sec);
    });

    app.appendChild(el('footer', null, UI[lang].powered));

    // Highlight the category being read
    if (cats.length > 1 && 'IntersectionObserver' in window) {
      var links = nav.querySelectorAll('a');
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) {
          if (en.isIntersecting) {
            var idx = en.target.id.replace('cat-', '');
            links.forEach(function (l, k) { l.classList.toggle('active', String(k) === idx); });
          }
        });
      }, { rootMargin: '-20% 0px -70% 0px' });
      document.querySelectorAll('section.cat').forEach(function (s) { io.observe(s); });
    }
  }

  fetch('/menus.json', { cache: 'no-cache' })
    .then(function (res) { if (!res.ok) throw new Error('bad response'); return res.json(); })
    .then(function (json) { data = json; render(); })
    .catch(function () { showMessage(UI[lang].error); });
})();
</script>
</body>
</html>
